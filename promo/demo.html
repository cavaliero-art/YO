<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>YO demo</title>
  <script>
    // the same "random" every render (YO's sound variants pick with it)
    (function () {
      let seed = 20261018;
      Math.random = () => {
        seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    })();
  </script>
  <link rel="stylesheet" href="demo.css">
</head>
<body>
  <div id="frame">
    <div id="glow"></div>
    <div id="captions"><div class="title"></div><div class="sub"></div></div>
    <div id="monitor">
      <div class="wall"></div>
      <img id="app" alt="">
      <div id="ripple"></div>
      <svg id="cursor" viewBox="0 0 24 36" width="34" height="51"><path d="M2 2v26l7-6.5 4.6 10.6 4.2-1.8-4.6-10.4H22z" fill="#fff" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <div class="taskbar"><i></i><i></i><i class="on"></i><i></i><i></i></div>
    </div>
    <div id="keys"></div>
    <div id="end">
      <div class="word">YO</div>
      <div class="free">Free for Windows</div>
      <div class="cta">Comment <b>« YO »</b> for the link</div>
    </div>
    <div class="marker" style="top: 959px"></div><div class="marker" style="top: 1919px"></div>
  </div>
  <script src="../renderer/sound.js"></script>
  <script src="band.js"></script>
  <script src="demo.js"></script>
</body>
</html>
