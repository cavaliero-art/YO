<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>YO promo</title>
  <script>
    // The video is code: time only moves when the renderer says so.
    // Every requestAnimationFrame callback waits for the next step, and the clock is the video's clock.
    (function () {
      let now = 0;
      let queue = [];
      window.requestAnimationFrame = (cb) => { queue.push(cb); return queue.length; };
      window.cancelAnimationFrame = () => {};
      performance.now = () => now;
      // the same "random" every render, so the video never changes between two renders
      let seed = 20261018;
      Math.random = () => {
        seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
      window.__clock = {
        tick(ms) {
          now = ms;
          const run = queue;
          queue = [];
          run.forEach((cb) => cb(ms));
        },
      };
    })();
  </script>
  <link rel="stylesheet" href="../renderer/style.css">
  <link rel="stylesheet" href="scene.css">
</head>
<body>
  <div id="frame">
    <div id="bg"></div>
    <div id="world">
      <div id="desk">
        <div class="wall"></div>
        <div class="pill"><div id="smallYo"></div></div>
        <div class="taskbar"><i></i><i></i><i class="on"></i><i></i><i></i></div>
      </div>
    </div>
    <svg id="ring" viewBox="0 0 200 200"><circle class="track" cx="100" cy="100" r="92"/><circle class="arc" cx="100" cy="100" r="92"/></svg>
    <div id="hero"><div id="bigYo"></div></div>
    <div id="label"></div>
    <div id="cards"></div>
    <div id="captions"></div>
    <div id="end">
      <div class="word">YO</div>
      <div class="free">Free for Windows</div>
      <div class="cta">Comment <b>« YO »</b> for the link</div>
    </div>
    <div class="marker" style="top: 959px"></div><div class="marker" style="top: 1919px"></div>
  </div>
  <script src="../renderer/mascot.js"></script>
  <script src="../renderer/commands.js"></script>
  <script src="band.js"></script>
  <script src="scene.js"></script>
</body>
</html>
